<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dBa Volume Detector</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <h1>Volume Detector</h1>
            <div class="meter-container">
                <div class="meter">
                    <div class="meter-fill"></div>
                    <div class="meter-labels">
                        <span>0</span>
                        <span>30</span>
                        <span>60</span>
                        <span>90</span>
                        <span>120</span>
                    </div>
                </div>
                <div class="reading">
                    <span class="db-value">--</span>
                    <span class="db-unit">dBa</span>
                </div>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span class="status-text">Click to start</span>
            </div>
            <button class="control-btn" id="startBtn">
                <span>Start Monitoring</span>
            </button>
            <div class="visualizer-container">
                <canvas id="visualizer" width="300" height="100"></canvas>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>

</body>
</html>
